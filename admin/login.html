<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin - Luan Rodrigues Fotografia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="admin-auth">
    <h1>Admin</h1>
    <form id="login-form" autocomplete="on">
      <input type="email" name="email" required autocomplete="email" placeholder="E-mail">
      <input type="password" name="password" required autocomplete="current-password" placeholder="Senha">
      <button type="submit">Entrar</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    const form = document.getElementById('login-form');
    const status = document.getElementById('status');
    const button = form.querySelector('button');

    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.replace('./');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.classList.remove('error');
      status.textContent = 'Entrando...';
      button.disabled = true;

      const fd = new FormData(form);
      const { error } = await supabase.auth.signInWithPassword({
        email: (fd.get('email') || '').trim(),
        password: fd.get('password') || ''
      });

      if (error) {
        const msg = (error.message || '').toLowerCase();
        status.textContent = msg.includes('invalid') || msg.includes('credentials')
          ? 'E-mail ou senha inválidos.'
          : `Erro: ${error.message}`;
        status.classList.add('error');
        button.disabled = false;
        return;
      }
      window.location.replace('./');
    });
  </script>
</body>
</html>
