<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Fotos - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="admin-shell">
    <div id="admin-shell-header"></div>

    <section class="photos-page">
      <div class="page-toolbar">
        <div class="segmented" id="view-toggle" role="tablist" aria-label="Filtrar por estado">
          <button type="button" data-view="active" class="active" role="tab" aria-selected="true">Ativas</button>
          <button type="button" data-view="archived" role="tab" aria-selected="false">Arquivadas</button>
        </div>
        <label class="field">
          Coleção
          <select id="collection-filter"></select>
        </label>
        <a href="./upload.html" class="button">Enviar fotos</a>
      </div>

      <div class="bulk-toolbar" id="bulk-toolbar">
        <label class="checkbox">
          <input type="checkbox" id="select-all">
          <span>Selecionar todas visíveis</span>
        </label>
        <div class="bulk-actions" id="bulk-actions" hidden>
          <span class="bulk-count" id="bulk-count">0</span>
          <button type="button" class="button" data-bulk="publish">Publicar</button>
          <button type="button" class="button ghost" data-bulk="unpublish">Despublicar</button>
          <button type="button" class="button ghost" data-bulk="archive">Arquivar</button>
          <button type="button" class="button ghost" data-bulk="unarchive" hidden>Restaurar</button>
          <button type="button" class="button danger" data-bulk="delete">Excluir</button>
          <button type="button" class="button ghost" data-bulk="clear">Limpar seleção</button>
        </div>
      </div>

      <div id="photos-list" class="photos-list">
        <p class="placeholder">Carregando...</p>
      </div>
    </section>
  </main>

  <script type="module" src="./js/photos-list.js"></script>
</body>
</html>
