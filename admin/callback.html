<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrando - Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="admin-auth">
    <h1>Entrando</h1>
    <p id="status" class="status" role="status" aria-live="polite">Verificando link...</p>
    <p id="retry" hidden><a href="./login.html" class="button ghost">Pedir novo link</a></p>
  </main>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    const status = document.getElementById('status');
    const retry = document.getElementById('retry');

    function showError(text) {
      status.textContent = text;
      status.classList.add('error');
      retry.hidden = false;
    }

    function friendlyError(err) {
      const code = err?.code || '';
      const msg = (err?.message || '').toLowerCase();
      const crossBrowser =
        code === 'flow_state_not_found' ||
        code === 'validation_failed' ||
        msg.includes('flow state') ||
        msg.includes('code verifier');
      if (crossBrowser) {
        return 'Este link precisa ser aberto no mesmo navegador que pediu o acesso. Peça um novo link e clique nele aqui.';
      }
      if (code === 'otp_expired' || msg.includes('expired')) {
        return 'Link expirado. Peça um novo.';
      }
      if (code === 'invalid_grant' || msg.includes('already used')) {
        return 'Este link já foi usado. Peça um novo.';
      }
      return `Erro ao entrar: ${err?.message || 'desconhecido'}.`;
    }

    async function redirectHome() {
      status.textContent = 'Autenticado. Redirecionando...';
      setTimeout(() => window.location.replace('./'), 400);
    }

    async function tryExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await redirectHome();
        return true;
      }
      return false;
    }

    const url = new URL(window.location.href);
    const code = url.searchParams.get('code');
    const errParam = url.searchParams.get('error') || url.hash.match(/error=([^&]+)/)?.[1];
    const errDesc = url.searchParams.get('error_description') || url.hash.match(/error_description=([^&]+)/)?.[1];

    if (errParam) {
      showError(decodeURIComponent(errDesc || errParam).replace(/\+/g, ' '));
    } else if (code) {
      let err = null;
      try {
        const { error } = await supabase.auth.exchangeCodeForSession(code);
        err = error;
      } catch (e) {
        err = e;
      }
      if (err) {
        if (!(await tryExistingSession())) showError(friendlyError(err));
      } else {
        await redirectHome();
      }
    } else if (!(await tryExistingSession())) {
      showError('Nenhum código no link. Volte ao login e peça um novo.');
    }
  </script>
</body>
</html>
